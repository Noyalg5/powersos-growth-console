<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Noyal George" />
    <meta
      name="description"
      content="Concept prototype by Noyal George: a business development console for a four-sided HV emergency-response ecosystem. All data is illustrative."
    />
    <meta name="robots" content="noindex, nofollow" />
    <title>PowerSOS Growth Console</title>
    <script>
      // Apply the saved or OS theme before first paint to avoid a flash.
      // The key matches THEME_STORAGE_KEY in src/lib/theme.ts.
      ;(function () {
        var theme = null
        try {
          theme = localStorage.getItem('pgc-theme')
        } catch (e) {}
        if (theme !== 'light' && theme !== 'dark') {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        }
        document.documentElement.classList.toggle('dark', theme === 'dark')
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
